open_source:
  - name: SGLang
    url: https://github.com/sgl-project/sglang/pulls?q=is%3Apr+author%3AWen-xuan-Xu
    logo: /assets/images/badges/sglangicon.png
    role: Open-source contributor
    description: >-
      I contribute to the SGLang community through community profile work,
      small bug fixes, and documentation improvements. I am currently learning
      NVFP4, PD disaggregation, and WideEP, with the long-term goal of growing
      into a strong LLM systems engineer and contributing to more roadmap-level
      work. For full contribution history, please check my GitHub activity.
    links:
      PRs: https://github.com/sgl-project/sglang/pulls?q=is%3Apr+author%3AWen-xuan-Xu
  - name: LiteInfer
    url: https://github.com/Wen-xuan-Xu/Literinfer
    role: Project developer
    description: >-
      A high-performance C++/CUDA LLM inference engine developed on top of
      KuiperLlama / KuiperInfer. LiteInfer extends the educational inference
      framework into a more complete serving stack for decoder-only LLMs,
      including hand-written CUDA kernels, vLLM-style paged KV cache,
      continuous batching, request scheduling, and INT8 / AWQ INT4 weight-only
      quantization. The project supports Llama-3 and Qwen-family models and is
      designed as a transparent systems-learning codebase without PyTorch
      runtime, external attention libraries, or external quantization kernels.
    links:
      GitHub: https://github.com/Wen-xuan-Xu/Literinfer

